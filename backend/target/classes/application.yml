server:
  port: 7700

spring:
  application:
    name: investment-tracker-backend
  
  datasource:
    url: jdbc:postgresql://localhost:5432/investment_tracker
    username: ${DB_USER:investor}
    password: ${DB_PASSWORD:Inv3stm3ntS3cur3P@ss2024!}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false
    open-in-view: false

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:mySuperSecretKeyForJWTTokenGeneration2024MinLength256Bits!!}
  expiration: 86400000

# Login Security
login:
  max-attempts: 3
  lock-duration-minutes: 5
  attempt-window-minutes: 5

# Logging
logging:
  level:
    com.investmenttracker: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
